name: Build you-get.exe

on:
  workflow_dispatch:
    inputs:
      you_get_tag:
        description: "Tag name of the target you-get version (e.g. 'v0.4.1743')"
        required: true
        default: "develop"
        type: string
      main_python_version:
        description: "Select a Python version for the main release"
        required: true
        default: "3.13"
        type: string

jobs:
  build:
    name: "Bundle you-get for Windows"
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        arch: ["x86", "x86_64"]
    outputs:
      uv-version: ${{ steps.setup-uv.outputs.uv-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Checkout submodule `you-get` to a specific commit"
        # https://github.com/actions/checkout/issues/503
        run: |
          git submodule update --init --recursive
          cd build/you-get
          git checkout ${{ inputs.you_get_tag }}

      - name: Install the latest version of uv
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "${{ matrix.python-version }}-${{ matrix.arch }}"
          # cache-python: "false"

      - name: "Build you-get.exe"
        run: |
          uv sync --frozen --index https://pypi.org/simple
          uv run build.py --ci

      - uses: actions/upload-artifact@v4
        with:
          name: you-get_py${{ matrix.python-version }}_${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/artifact_info.json

  release:
    name: "Create release"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: .ci

      - name: "Prepare for release"
        id: prepare
        env:
          PYTHONPATH: .
        run: |
          echo "date=$(date '+%y%m%d')" >> "$GITHUB_OUTPUT"
          python scripts/ci/main.py --uv ${{ needs.build.outputs.uv-version }} --main ${{ inputs.main_python_version }}

      - name: "Release"
        uses: softprops/action-gh-release@v2
        with:
          files: .ci/**/*.zip
          # draft: true
          name: Unofficial Build ${{ steps.prepare.outputs.date }} for ${{ inputs.you_get_tag }}
          body_path: scripts/ci/release_notes.md
